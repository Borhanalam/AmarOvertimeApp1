name: Build Android APK from ZIP

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Find and Extract ZIP Project
      run: |
        ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Found zip file: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted_project
          
          # Check if project files are inside a subfolder inside ZIP
          if [ -d "extracted_project/AmarOvertimeAndroid" ]; then
            cp -r extracted_project/AmarOvertimeAndroid/* .
          elif [ -d "extracted_project/AmarOvertimeAndroid-main" ]; then
            cp -r extracted_project/AmarOvertimeAndroid-main/* .
          else
            cp -r extracted_project/* .
          fi
        else
          echo "No zip file found, proceeding with repository files."
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Build Debug APK
      run: ./gradlew assembleDebug || gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        
